[package]
name = "nila-webs"
version = "0.4.0"
description = "Windows-first visual React + Vite website builder"
authors = ["Nila Webs contributors"]
edition = "2021"

[lib]
name = "nila_webs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
