name: Apply Phase 3 Final

on:
  push:
    paths:
      - 'phase3final.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Phase 3 source update
        run: |
          cat phase3fin.part.* > /tmp/phase3-final.b64
          base64 -d /tmp/phase3-final.b64 | gzip -d > /tmp/phase3-final.patch
          git apply --check /tmp/phase3-final.patch
          git apply /tmp/phase3-final.patch
          rm -f phase3fin.part.* phase3final.trigger .github/workflows/apply-phase3-final.yml
      - name: Commit final Phase 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete phase 3 visual element system"
          git push origin HEAD:main
