name: Apply Phase 3 Patch

on:
  push:
    paths:
      - 'phase3.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply Phase 3 source update
        run: |
          cat phase3.part.* > /tmp/phase3.b64
          base64 -d /tmp/phase3.b64 | gzip -d > /tmp/phase3.patch
          git apply --check --exclude=docs/BLOCK_CATALOG.md /tmp/phase3.patch
          git apply --exclude=docs/BLOCK_CATALOG.md /tmp/phase3.patch
          rm -f phase3.part.* phase3.trigger phase3.patch.gz.b64 .github/workflows/apply-phase3.yml
      - name: Commit Phase 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: start phase 3 advanced element system"
          git push origin HEAD:main
