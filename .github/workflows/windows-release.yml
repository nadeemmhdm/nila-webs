name: Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/verify-phase10.mjs'
      - '.github/workflows/web-build.yml'
      - '.github/workflows/windows-release.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach installers to (example: v1.6.0). Leave blank to use package.json version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Phase 10 release configuration
        run: npm run verify:phase10

      - name: Build web editor
        run: npm run build

      - name: Build Windows NSIS and MSI installers
        run: npm run tauri:build:windows

      - name: Validate and stage installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File -ErrorAction SilentlyContinue
          if (-not $nsis) { throw 'No NSIS .exe installer found' }
          if (-not $msi) { throw 'No MSI installer found' }
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          $nsis | Copy-Item -Destination 'artifacts'
          $msi | Copy-Item -Destination 'artifacts'
          $hashLines = @()
          Get-ChildItem 'artifacts' -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            $hashLines += "$($h.Hash.ToLower())  $($_.Name)"
          }
          $hashLines | Set-Content -Path 'artifacts/SHA256SUMS.txt' -Encoding utf8
          Get-ChildItem 'artifacts' | Format-Table Name, Length
          Get-Content 'artifacts/SHA256SUMS.txt'

      - name: Upload Windows installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nila-webs-windows-installers
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Resolve GitHub Release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = ''
          if ('${{ github.event_name }}' -eq 'release') {
            $tag = '${{ github.event.release.tag_name }}'
          } elseif ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.release_tag }}') {
            $tag = '${{ inputs.release_tag }}'
          } else {
            $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
            $tag = "v$version"
          }
          if (-not $tag) { throw 'Could not resolve release tag' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release tag: $tag"

      - name: Attach installers to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.release_tag.outputs.tag }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No GitHub Release named $tag exists yet. Installers remain available as the workflow artifact."
            exit 0
          }
          Get-ChildItem 'artifacts' -File | ForEach-Object {
            Write-Host "Uploading $($_.Name) to $tag"
            gh release upload $tag $_.FullName --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($_.Name) to release $tag" }
          }
          Write-Host "Windows installers attached to GitHub Release $tag"
