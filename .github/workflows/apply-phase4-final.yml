name: Phase 4 Compile Fix

on:
  push:
    paths:
      - 'phase4compilefix.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strict TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/NodeRenderer.tsx')
          s = p.read_text()
          old = '<progress value={Number(node.value || 0)} min={node.min ?? 0} max={node.max ?? 100}/>'
          new = '<progress value={Number(node.value || 0)} max={node.max ?? 100}/>'
          assert old in s, 'progress pattern not found'
          p.write_text(s.replace(old, new, 1))

          p = Path('src/lib/prompt-adapter.ts')
          s = p.read_text()
          old = 'import type { BuilderNode, ImportedBlock } from "../types";\nimport { createNode, uid } from "./nodes";'
          new = 'import type { BuilderNode, ImportedBlock, NodeStyle } from "../types";\nimport { createNode, defaultStyle, uid } from "./nodes";'
          assert old in s, 'prompt adapter import pattern not found'
          s = s.replace(old, new, 1)
          old = 'const S = (style: Record<string, unknown>) => style as BuilderNode["style"];'
          new = 'const S = (style: Partial<NodeStyle>): NodeStyle => ({ ...defaultStyle(), ...style });'
          assert old in s, 'prompt adapter style helper not found'
          p.write_text(s.replace(old, new, 1))

          p = Path('src/templates/phase3-elements.ts')
          s = p.read_text()
          old = 'import type { BuilderNode, InputKind, LibraryItem, NodeType } from "../types";'
          new = 'import type { BuilderNode, InputKind, LibraryItem, NodeStyle, NodeType } from "../types";'
          assert old in s, 'phase3 elements import pattern not found'
          s = s.replace(old, new, 1)
          old = 'const node = (type: NodeType, name: string, extra: Partial<BuilderNode> = {}): BuilderNode => ({'
          new = 'type NodeExtra = Omit<Partial<BuilderNode>, "style"> & { style?: Partial<NodeStyle> };\n\nconst node = (type: NodeType, name: string, extra: NodeExtra = {}): BuilderNode => ({'
          assert old in s, 'phase3 node helper pattern not found'
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f phase4compilefix.trigger
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Phase 3
        run: npm run verify:phase3
      - name: Verify Phase 4
        run: npm run verify:phase4
      - name: Regression gate
        run: npm run check:phase3
      - name: Build
        run: npm run build
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NodeRenderer.tsx src/lib/prompt-adapter.ts src/templates/phase3-elements.ts phase4compilefix.trigger
          git commit -m "fix: harden Phase 4 TypeScript compatibility"
          git push origin HEAD:main
