name: Apply Phase 4 Complete

on:
  push:
    paths:
      - 'phase4complete.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct verified Phase 4 source
        run: |
          cat p4finalsrc.part.* > /tmp/p4final.b64
          base64 -d /tmp/p4final.b64 > /tmp/p4final.tar.gz
          echo "fab729930ef4e939730bbe4a2e36acfc99d0998ac225f222865c2d642c3918ef  /tmp/p4final.tar.gz" | sha256sum -c -
          gzip -t /tmp/p4final.tar.gz
          tar -xzf /tmp/p4final.tar.gz
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/prompt-adapter.ts')
          s = p.read_text()
          old = '.map(mediaNode)'
          new = '.map((url, index) => mediaNode(url, index))'
          assert old in s, 'media mapper pattern missing'
          p.write_text(s.replace(old, new, 1))
          PY
          git checkout -- .github/workflows/web-build.yml
          rm -f p4finalsrc.part.* phase4complete.trigger
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Phase 3 compatibility
        run: npm run verify:phase3
      - name: Verify Phase 4 engine
        run: npm run verify:phase4
      - name: Verify Phase 4 final scope
        run: npm run verify:phase4-final
      - name: Phase 3 regression gate
        run: npm run check:phase3
      - name: Production build
        run: npm run build
      - name: Commit Phase 4 final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete phase 4 block and template engine"
          git pull --rebase origin main
          git push origin HEAD:main
