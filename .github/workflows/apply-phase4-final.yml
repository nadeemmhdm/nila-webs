name: Apply Phase 6 Complete

on:
  push:
    paths:
      - 'p6.patch.b64*'
      - '.github/workflows/apply-phase4-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and apply Phase 6
        run: |
          cat p6.patch.b64 p6.patch.b64.01 | base64 -d > /tmp/p6.patch.gz
          echo "8c8ffd5cc7b6bcb10b929f3cb4487ff3735fe2010075d69883be17b63987b902  /tmp/p6.patch.gz" | sha256sum -c -
          gzip -t /tmp/p6.patch.gz
          gzip -dc /tmp/p6.patch.gz > /tmp/p6.patch
          git apply --check /tmp/p6.patch
          git apply /tmp/p6.patch
          rm -f p6.patch.b64 p6.patch.b64.01
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Phase 3 compatibility
        run: npm run verify:phase3
      - name: Verify Phase 4 engine
        run: npm run verify:phase4
      - name: Verify Phase 4 final scope
        run: npm run verify:phase4-final
      - name: Verify Phase 5 responsive system
        run: npm run verify:phase5
      - name: Verify Phase 6 motion studio
        run: npm run verify:phase6
      - name: Regression gate
        run: npm run check:phase3
      - name: Production build
        run: npm run build
      - name: Commit Phase 6 final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete phase 6 motion and interaction studio"
          git push origin HEAD:main
