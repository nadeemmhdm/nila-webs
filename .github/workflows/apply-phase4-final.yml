name: Apply Real React Export

on:
  push:
    paths:
      - 'react-export.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and apply source patch
        run: |
          cat rex2.part.* > /tmp/reactexp.b64
          base64 -d /tmp/reactexp.b64 > /tmp/reactexp.patch.gz
          echo "a988c122893b614cf7553d3350a80c1424603e8abd1af876d09e0e95845d6cd4  /tmp/reactexp.patch.gz" | sha256sum -c -
          gzip -t /tmp/reactexp.patch.gz
          gzip -dc /tmp/reactexp.patch.gz > /tmp/reactexp.patch
          git apply --check /tmp/reactexp.patch
          git apply /tmp/reactexp.patch
          rm -f rex2.part.* reactexp.part.* react-export.trigger
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Phase 3 compatibility
        run: npm run verify:phase3
      - name: Verify Phase 4 engine
        run: npm run verify:phase4
      - name: Verify Phase 4 final scope
        run: npm run verify:phase4-final
      - name: Verify Phase 5 responsive system
        run: npm run verify:phase5
      - name: Verify Phase 6 motion studio
        run: npm run verify:phase6
      - name: Verify Phase 7 navigation forms and SEO
        run: npm run verify:phase7
      - name: Verify Phase 8 quality center
        run: npm run verify:phase8
      - name: Verify real React/Vite export
        run: npm run verify:react-export
      - name: Regression gate
        run: npm run check:phase3
      - name: Production build
        run: npm run build
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: generate real React Vite website source"
          git push origin HEAD:main
